<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2b1a12">
  <meta name="description" content="Kaldi Cafe dijital menü">
  <title>Kaldi Cafe | Menü</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner shell">
      <button id="backButton" class="icon-action back-action" type="button" aria-label="Kategorilere dön" hidden>←</button>

      <div class="brand">
        <img class="logo" src="/assets/kaldi-logo.png" alt="Kaldi Cafe">
      </div>

      <div class="header-actions">
        <button id="themeButton" class="icon-action theme-button" type="button" aria-label="Tema değiştir">◐</button>
        <button id="cartButton" class="cart-button" type="button" hidden>
          Sepet <span id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="shell main">
    <div id="tableBadge" class="table-badge" hidden></div>

    <section id="homeView">
      <div class="intro">
        <span class="eyebrow">KALDİ CAFE</span>
        <h1>Dijital Menü</h1>
        <p id="tagline" class="tagline">Kahve • Kahvaltı • Lezzet</p>
      </div>

      <label class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Ne arıyorsunuz?" autocomplete="off">
      </label>

      <section class="category-section-home">
        <div class="section-head">
          <div>
            <span class="section-kicker">MENÜ</span>
            <h2>Kategoriler</h2>
          </div>
        </div>
        <div id="categoryGrid" class="category-grid">
          <div class="loading">Menü hazırlanıyor...</div>
        </div>
      </section>

      <section id="searchResults" hidden>
        <div class="section-head">
          <div>
            <span class="section-kicker">ARAMA</span>
            <h2>Sonuçlar</h2>
          </div>
          <span id="searchCount"></span>
        </div>
        <div id="searchProductList" class="product-list"></div>
      </section>
    </section>

    <section id="categoryView" hidden>
      <div class="category-toolbar">
        <button id="categoryBackInline" class="category-back" type="button">← Kategoriler</button>
        <span id="categoryMiniCount" class="category-mini-count"></span>
      </div>

      <div id="categoryHero" class="category-hero"></div>

      <div id="productList" class="product-list"></div>
    </section>
  </main>

  <div id="cartSheet" class="sheet" hidden>
    <button class="sheet-backdrop" data-close-cart aria-label="Sepeti kapat"></button>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-label="Sepet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div><span class="mini-label">SİPARİŞİNİZ</span><h2>Sepet</h2></div>
        <button class="icon-button" data-close-cart type="button">✕</button>
      </div>
      <div id="cartItems" class="cart-items"></div>
      <label id="noteWrap" class="order-note">
        <span>Sipariş notu</span>
        <textarea id="orderNote" rows="3" maxlength="300" placeholder="Örn. şekersiz, az pişmiş..."></textarea>
      </label>
      <div class="cart-total"><span>Toplam</span><strong id="cartTotal">0 ₺</strong></div>
      <button id="submitOrder" class="primary-button" type="button">Siparişi Gönder</button>
      <p class="approval-note">Siparişiniz işletme onayından sonra hazırlanır.</p>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <footer class="footer shell"><span>Kaldi Cafe</span><small>ACAR BİLİŞİM • KaldiPOS</small></footer>
  <script src="/app.js" defer></script>
</body>
</html>
